<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Ajedrez</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body { font-family: sans-serif; background: #262522; color: #fff; padding: 10px; margin: 0; }
        .container { max-width: 550px; width: 95%; margin: 20px auto; background: #2a2926; padding: 25px; border-radius: 12px; border: 1px solid #4a4944; box-sizing: border-box; }
        button.btn-volver { padding: 14px; font-size: 16px; width: 100%; box-sizing: border-box; margin-bottom: 20px; border-radius: 6px; background: #4a4944; color: white; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button.btn-volver:hover { background: #5c5b55; }
        #wrapperTablero { width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        
        .fila-jugador { display: flex; align-items: center; justify-content: space-between; font-size: 15px; padding: 6px 10px; background: #3c3b37; border-radius: 6px; border: 1px solid #4a4944; }
        .info-usuario { display: flex; align-items: center; gap: 10px; }
        .profile-avatar { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; display: block; }
        .avatar-inicial { width: 30px; height: 30px; border-radius: 50%; background-color: #4a4944; color: #eeeeee; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .nombre-texto { font-weight: bold; color: #fff; }

        /* Barra de balance / ventaja bicolor (negro y blanco) */
        .barra-ventaja-container { width: 100%; height: 6px; background: #4a4944; border-radius: 3px; overflow: hidden; display: flex; margin: 4px 0; }
        .barra-ventaja-blancas { width: 50%; height: 100%; background: #ffffff; transition: width 0.3s ease; }
        .barra-ventaja-negras { width: 50%; height: 100%; background: #1a1a1a; transition: width 0.3s ease; }

        /* Panel de movimientos limpio y moderno */
        .panel-historial { background: #21201e; border: 1px solid #4a4944; border-radius: 8px; padding: 12px; margin-top: 10px; width: 100%; box-sizing: border-box; }
        .lista-movimientos { max-height: 130px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 4px; margin-bottom: 10px; }
        .lista-movimientos::-webkit-scrollbar { width: 5px; }
        .lista-movimientos::-webkit-scrollbar-thumb { background: #4a4944; border-radius: 3px; }
        
        .fila-historial { display: flex; align-items: center; font-size: 13px; padding: 4px 6px; border-radius: 4px; gap: 8px; }
        .fila-historial:hover { background: #2a2926; }
        .turno-num { color: #8c8b87; font-weight: bold; width: 30px; }
        .movimiento-item { flex: 1; padding: 3px 6px; border-radius: 4px; cursor: pointer; text-align: center; color: #dcdbd6; transition: background 0.15s; }
        .movimiento-item:hover { background: #3c3b37; color: #fff; }
        .movimiento-activo { background: #81b64c !important; color: #fff !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-volver" onclick="window.location.href='index.html'">⬅️ Volver al Buscador</button>
    
    <div id="wrapperTablero">
        <div id="perfilRival" class="fila-jugador"></div>
        
        <!-- Barra de ventaja bicolor -->
        <div class="barra-ventaja-container">
            <div id="barraBlancas" class="barra-ventaja-blancas"></div>
            <div id="barraNegras" class="barra-ventaja-negras"></div>
        </div>

        <div id="board" style="width: 100%"></div>
        <div id="perfilPropio" class="fila-jugador"></div>
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', async () => {
    const datosRaw = localStorage.getItem('partida_actual');
    if (!datosRaw) { 
        alert("No se seleccionó ninguna partida."); 
        window.location.href = 'index.html';
        return; 
    }
    
    const partida = JSON.parse(datosRaw);
    const usuarioActual = localStorage.getItem('usuario_actual') || "oscar2298";

    async function obtenerAvatar(username) {
        const urlPerfil = `https://api.chess.com/pub/player/${username}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlPerfil)}`;
        try {
            const respuesta = await fetch(proxyUrl);
            if (!respuesta.ok) return null;
            const contenedor = await respuesta.json();
            const datosPerfil = JSON.parse(contenedor.contents);
            return datosPerfil.avatar || null;
        } catch (e) { return null; }
    }

    function renderizarAvatarHtml(username, avatarUrl) {
        if (avatarUrl) {
            return `<img src="${avatarUrl}" class="profile-avatar" alt="${username}">`;
        } else {
            const primeraLetra = username.charAt(0);
            return `<div class="avatar-inicial">${primeraLetra}</div>`;
        }
    }

    const avatarBlancas = await obtenerAvatar(partida.white.username);
    const avatarNegras = await obtenerAvatar(partida.black.username);
    let datosRival, datosPropio;

    if (partida.black.username.toLowerCase() === usuarioActual.toLowerCase()) {
        datosPropio = { username: partida.black.username, avatar: avatarNegras };
        datosRival = { username: partida.white.username, avatar: avatarBlancas };
    } else {
        datosPropio = { username: partida.white.username, avatar: avatarBlancas };
        datosRival = { username: partida.black.username, avatar: avatarNegras };
    }

    document.getElementById('perfilRival').innerHTML = `<div class="info-usuario">${renderizarAvatarHtml(datosRival.username, datosRival.avatar)} <span class="nombre-texto">${datosRival.username}</span></div>`;
    document.getElementById('perfilPropio').innerHTML = `<div class="info-usuario">${renderizarAvatarHtml(datosPropio.username, datosPropio.avatar)} <span class="nombre-texto">${datosPropio.username}</span></div>`;
});
</script>

<script src="controles.js"></script>

</body>
</html>
